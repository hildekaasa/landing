<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My landing page</title>
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <!-- We need this line below for responsiveness! -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.2/css/all.css">
</head>

<body>
  <!-- code a Hero / Banner section -->
  <div class="banner" style= "background-image: url(./images/background.png);">
    <div class="container">
      <h1>Welcome to <em>My Landing Page</em></h1>
      <p>Your journey starts here...</p>
      <a href="./images/background.png" class="btn-primary">Get Started</a>
    </div>
  </div>

  <!-- code a "How it works" section -->
  <div class="container">
    <h2 class="text-center">How It Works</h2>
    <div class="cards">

      <div class="card">
        <img class="card-img" src="./images/apply.svg" alt="Step 1">
        <h3>Step 1</h3>
        <p>Sign up for an account to get started.</p>
      </div>

      <div class="card">
        <img class="card-img" src="./images/product.svg" alt=" Step 2" >
        <h3>Step 2</h3>
        <p>Customize your profile and preferences.</p>
      </div>

      <div class="card">
        <img class="card-img" src="./images/learn.svg" alt="Step 3">
        <h3>Step 3</h3>
        <p>Explore our features and enjoy the experience.</p>
      </div>

    </div>
  </div>

  <!-- code a footer -->
  <div class="footer" style = "background-color: rgba(24, 23, 23, 0.89);">
    <div class="container">
      <link><a href="#">
        <i class="fab fa-facebook-f"></i></a></link>
      <link><a href="#">
        <i class="fab fa-github"></i></a></link>
      <link><a href="#">
        <i class="fab fa-twitter"></i></a></link>
      <link> <a href="#">
        <i class="fab fa-linkedin-in"></i></a></link>
      <p>This website was coded with blood, sweat and happy tears.</p>
    </div>
  </div>

</body>
</html>
